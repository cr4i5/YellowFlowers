<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor amarilla para ti</title>
<meta name="description" content="Alguien te envió una flor amarilla.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Símbolos de flores, reutilizados con <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="flor-girasol">
      <path d="M100,178 C94,215 106,250 100,300" fill="none" stroke="#3f6b3f" stroke-width="7" stroke-linecap="round"/>
      <path d="M100,222 C78,214 62,226 54,244 C76,252 94,240 100,222 Z" fill="#4a7a46"/>
      <path d="M100,256 C122,248 138,260 146,278 C124,286 106,274 100,256 Z" fill="#4a7a46"/>
      <g fill="var(--yellow)" stroke="#7a4f18" stroke-width="1.2" stroke-linejoin="round">
        <ellipse cx="100" cy="38" rx="16" ry="40"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(45 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(135 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(225 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="38" rx="16" ry="40" transform="rotate(315 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="25" fill="#5b3a1f"/>
      <circle cx="100" cy="100" r="25" fill="none" stroke="#f7efe1" stroke-width="1.5" opacity="0.5"/>
    </g>

    <g id="flor-margarita">
      <path d="M100,178 C94,215 106,250 100,300" fill="none" stroke="#3f6b3f" stroke-width="7" stroke-linecap="round"/>
      <path d="M100,222 C78,214 62,226 54,244 C76,252 94,240 100,222 Z" fill="#4a7a46"/>
      <path d="M100,256 C122,248 138,260 146,278 C124,286 106,274 100,256 Z" fill="#4a7a46"/>
      <g fill="var(--yellow)" stroke="#7a4f18" stroke-width="1" stroke-linejoin="round">
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(0 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(30 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(120 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(150 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(210 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(240 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(300 100 100)"/>
        <ellipse cx="100" cy="54" rx="7" ry="46" transform="rotate(330 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="20" fill="#8a5a1f"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#f7efe1" stroke-width="1.2" opacity="0.4"/>
    </g>

    <g id="flor-tulipan">
      <path d="M100,178 C94,215 106,250 100,300" fill="none" stroke="#3f6b3f" stroke-width="7" stroke-linecap="round"/>
      <path d="M100,222 C78,214 62,226 54,244 C76,252 94,240 100,222 Z" fill="#4a7a46"/>
      <path d="M100,256 C122,248 138,260 146,278 C124,286 106,274 100,256 Z" fill="#4a7a46"/>
      <path d="M70,178 C50,170 44,148 50,124 C56,102 72,86 90,78 C82,104 78,132 82,158 C84,168 76,176 70,178 Z" fill="var(--yellow)" opacity="0.92" stroke="#7a4f18" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M130,178 C150,170 156,148 150,124 C144,102 128,86 110,78 C118,104 122,132 118,158 C116,168 124,176 130,178 Z" fill="var(--yellow)" opacity="0.92" stroke="#7a4f18" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M100,180 C82,180 72,156 74,130 C76,100 86,68 100,44 C114,68 124,100 126,130 C128,156 118,180 100,180 Z" fill="var(--yellow)" stroke="#7a4f18" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M100,64 L100,172" stroke="#7a4f18" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
    </g>

    <g id="flor-rosa">
      <path d="M100,178 C94,215 106,250 100,300" fill="none" stroke="#3f6b3f" stroke-width="7" stroke-linecap="round"/>
      <path d="M100,222 C78,214 62,226 54,244 C76,252 94,240 100,222 Z" fill="#4a7a46"/>
      <path d="M100,256 C122,248 138,260 146,278 C124,286 106,274 100,256 Z" fill="#4a7a46"/>
      <g fill="var(--yellow)" stroke="#7a4f18" stroke-width="1" stroke-linejoin="round">
        <circle cx="100" cy="100" r="42"/>
        <circle cx="78" cy="84" r="24" opacity="0.9"/>
        <circle cx="122" cy="84" r="24" opacity="0.9"/>
        <circle cx="100" cy="64" r="24" opacity="0.9"/>
        <circle cx="82" cy="116" r="22" opacity="0.85"/>
        <circle cx="118" cy="116" r="22" opacity="0.85"/>
      </g>
      <circle cx="100" cy="100" r="18" fill="#c9862a"/>
      <circle cx="100" cy="100" r="18" fill="none" stroke="#f7efe1" stroke-width="1" opacity="0.35"/>
    </g>
  </defs>
</svg>

<main class="tarjeta-page">
  <div class="bloom-stage" id="bloom-stage" hidden></div>

  <div class="card card-pending" id="card">
    <div class="petals-layer" id="petals"></div>
    <div class="card-flower">
      <svg viewBox="0 0 200 320" aria-hidden="true"><use href="#flor-girasol" id="flower-use"></use></svg>
    </div>
    <p class="card-to">Para <span id="c-to">ti</span></p>
    <p class="card-msg" id="c-msg">Hoy es un buen día para regalar flores amarillas.</p>
    <p class="card-from" id="c-from"></p>
  </div>
  <div class="tarjeta-footer">
    <a href="index.html">Crea tu propia tarjeta</a>
  </div>
</main>

<script src="tarjeta.js"></script>
</body>
</html>
