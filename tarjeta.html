<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor amarilla para ti</title>
<meta name="description" content="Alguien te envió una flor amarilla.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Símbolos de flores, reutilizados con <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="flor-girasol">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <g fill="var(--yellow)" stroke="#a66a17" stroke-width="1.2">
        <ellipse cx="100" cy="43" rx="15" ry="43"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(45 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(135 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(225 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(315 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="27" fill="#5a3518"/>
      <circle cx="91" cy="91" r="4" fill="#8f5a23" opacity=".8"/>
      <circle cx="108" cy="106" r="3" fill="#9b6529" opacity=".8"/>
    </g>

    <g id="flor-rosa">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <g fill="var(--yellow)" stroke="#a66a17" stroke-width="1.4">
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(0 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(51 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(102 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(153 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(204 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(255 100 100)"/>
        <ellipse cx="100" cy="66" rx="25" ry="33" transform="rotate(306 100 100)"/>
      </g>
      <g fill="#d99420" stroke="#a66a17" stroke-width="1.2">
        <ellipse cx="100" cy="80" rx="15" ry="19" transform="rotate(25 100 100)"/>
        <ellipse cx="100" cy="80" rx="15" ry="19" transform="rotate(97 100 100)"/>
        <ellipse cx="100" cy="80" rx="15" ry="19" transform="rotate(169 100 100)"/>
        <ellipse cx="100" cy="80" rx="15" ry="19" transform="rotate(241 100 100)"/>
        <ellipse cx="100" cy="80" rx="15" ry="19" transform="rotate(313 100 100)"/>
      </g>
      <path d="M100,100 C108,96 110,87 103,83 C98,81 93,84 94,90" fill="none" stroke="#8a4f14" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Tulipán: copa cerrada de una sola pieza, con una copa de 3 puntas suaves arriba -->
    <g id="flor-tulipan">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <path d="M100 178 C84 178 70 172 68 168 C58 155 55 140 60 130 C64 120 68 98 72 78 C77 84 82 87 86 88 C90 80 96 64 100 55 C104 64 110 80 114 88 C118 87 123 84 128 78 C132 98 136 120 140 130 C145 140 142 155 132 168 C130 172 116 178 100 178Z"
        fill="var(--yellow)" stroke="#a66a17" stroke-width="2.2"/>
      <path d="M100 60 L100 172" stroke="#a66a17" stroke-width="1.3" opacity=".3"/>
      <path d="M84 86 C80 115 82 145 90 170" fill="none" stroke="#a66a17" stroke-width="1.1" opacity=".22"/>
      <path d="M116 86 C120 115 118 145 110 170" fill="none" stroke="#a66a17" stroke-width="1.1" opacity=".22"/>
    </g>

    <!-- Orquídea: dos alas, dos sépalos inferiores y el labelo con manchas, como una orquídea real -->
    <g id="flor-orquidea">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <ellipse cx="100" cy="72" rx="15" ry="27" fill="#f3d98a" stroke="#a66a17" stroke-width="1.4"/>
      <ellipse cx="66" cy="90" rx="34" ry="19" transform="rotate(-16 66 90)" fill="#f7e3a8" stroke="#a66a17" stroke-width="1.4"/>
      <ellipse cx="134" cy="90" rx="34" ry="19" transform="rotate(16 134 90)" fill="#f7e3a8" stroke="#a66a17" stroke-width="1.4"/>
      <ellipse cx="76" cy="122" rx="15" ry="23" transform="rotate(-38 76 122)" fill="#f3d98a" stroke="#a66a17" stroke-width="1.3"/>
      <ellipse cx="124" cy="122" rx="15" ry="23" transform="rotate(38 124 122)" fill="#f3d98a" stroke="#a66a17" stroke-width="1.3"/>
      <path d="M100 98 C86 101 76 113 73 128 C70 148 82 168 100 180 C118 168 130 148 127 128 C124 113 114 101 100 98Z"
        fill="var(--yellow)" stroke="#a66a17" stroke-width="1.6"/>
      <path d="M100 114 C92 119 86 131 89 141 C92 151 100 156 100 156 C100 156 108 151 111 141 C114 131 108 119 100 114Z"
        fill="#c9862a" stroke="#a66a17" stroke-width="1"/>
      <circle cx="90" cy="138" r="2.4" fill="#8a4f14"/>
      <circle cx="100" cy="145" r="2.4" fill="#8a4f14"/>
      <circle cx="110" cy="138" r="2.4" fill="#8a4f14"/>
      <ellipse cx="100" cy="99" rx="7.5" ry="9" fill="#fff3d0" stroke="#a66a17" stroke-width="1"/>
    </g>

    <!-- Adornos reutilizables de la tarjeta -->
    <g id="corner-flourish">
      <path d="M6,74 C6,40 6,6 40,6" fill="none" stroke="#a66a17" stroke-width="2" stroke-linecap="round"/>
      <path d="M16,74 C16,46 16,16 40,16" fill="none" stroke="#a66a17" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
      <path d="M40,6 C50,6 55,11 55,18 C55,24 50,27 45,25" fill="none" stroke="#a66a17" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="6" cy="74" r="3" fill="#a66a17"/>
    </g>
    <g id="ornament-divider">
      <line x1="2" y1="13" x2="94" y2="13" stroke="#a66a17" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="126" y1="13" x2="218" y2="13" stroke="#a66a17" stroke-width="1.4" stroke-linecap="round"/>
      <path transform="translate(110,6) scale(0.85)" d="M0,4 C-4,-2 -10,-2 -10,3 C-10,8 -4,10 0,14 C4,10 10,8 10,3 C10,-2 4,-2 0,4Z" fill="#a66a17"/>
    </g>
    <g id="ornament-flourish">
      <path d="M2,10 C15,10 15,3 30,3 C45,3 45,10 58,10" fill="none" stroke="#a66a17" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="30" cy="10" r="2.6" fill="#a66a17"/>
    </g>
  </defs>
</svg>

<main class="tarjeta-page">
  <div class="flower-meadow" id="flower-meadow" aria-hidden="true"></div>

  <div class="card-stack">
  <div class="card card-pending" id="card">
    <div class="petals-layer" id="petals"></div>

    <svg class="card-corner tl" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner-flourish"></use></svg>
    <svg class="card-corner tr" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner-flourish"></use></svg>
    <svg class="card-corner bl" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner-flourish"></use></svg>
    <svg class="card-corner br" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner-flourish"></use></svg>

    <div class="card-spray tl" aria-hidden="true">
      <svg viewBox="0 0 200 320"><use href="#flor-girasol" id="spray-tl-use"></use></svg>
    </div>
    <div class="card-spray br" aria-hidden="true">
      <svg viewBox="0 0 200 320"><use href="#flor-girasol" id="spray-br-use"></use></svg>
    </div>

    <div class="card-flower">
      <svg viewBox="0 0 200 320" aria-hidden="true"><use href="#flor-girasol" id="flower-use"></use></svg>
    </div>

    <svg class="ornament-divider" viewBox="0 0 220 26" aria-hidden="true"><use href="#ornament-divider"></use></svg>
    <p class="card-to">Para <span id="c-to">ti</span></p>
    <svg class="ornament-divider" viewBox="0 0 220 26" aria-hidden="true"><use href="#ornament-divider"></use></svg>

    <p class="card-msg" id="c-msg">Hoy es un buen día para regalar flores amarillas.</p>

    <div class="card-ornament" aria-hidden="true">
      <svg viewBox="0 0 60 20"><use href="#ornament-flourish"></use></svg>
    </div>
    <p class="card-from" id="c-from"></p>
  </div>
  </div>
</main>

<script src="tarjeta.js"></script>
</body>
</html>
