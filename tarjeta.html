<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor amarilla para ti</title>
<meta name="description" content="Alguien te envió una flor amarilla.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-blooms" aria-hidden="true"></div>

<!-- Símbolos de flores, reutilizados con <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="flor-girasol">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <g fill="var(--yellow)" stroke="#a66a17" stroke-width="1.2">
        <ellipse cx="100" cy="43" rx="15" ry="43"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(45 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(135 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(225 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(315 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="27" fill="#5a3518"/>
      <circle cx="91" cy="91" r="4" fill="#8f5a23" opacity=".8"/>
      <circle cx="108" cy="106" r="3" fill="#9b6529" opacity=".8"/>
    </g>

    <g id="flor-margarita">
      <path d="M100 176 C95 215 103 250 100 302" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 224 C79 211 59 222 53 244 C76 252 94 243 100 224Z" fill="#4f824c"/>
      <path d="M100 260 C121 247 140 259 147 280 C124 286 107 276 100 260Z" fill="#477845"/>
      <g fill="#fff8e8" stroke="#d7c7a5" stroke-width="1">
        <ellipse cx="100" cy="49" rx="10" ry="47"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(30 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(120 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(150 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(210 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(240 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(300 100 100)"/>
        <ellipse cx="100" cy="49" rx="10" ry="47" transform="rotate(330 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="21" fill="#d89b28"/>
      <circle cx="100" cy="100" r="15" fill="#b87920"/>
    </g>

    <!-- Tulipán: copa ancha, pétalos separados y cáliz claramente reconocible -->
    <g id="flor-tulipan">
      <path d="M100 174 C96 213 103 252 100 304" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 223 C79 209 55 222 49 248 C74 255 93 242 100 223Z" fill="#4f824c"/>
      <path d="M100 258 C120 246 142 260 150 283 C125 288 107 276 100 258Z" fill="#477845"/>
      <path d="M55 70
               C62 93 65 112 63 132
               C61 153 73 176 91 181
               C98 183 100 174 100 164
               C99 145 93 127 92 109
               C91 91 82 76 70 65Z"
            fill="#e6a52c" stroke="#a86619" stroke-width="1.5"/>
      <path d="M145 70
               C138 93 135 112 137 132
               C139 153 127 176 109 181
               C102 183 100 174 100 164
               C101 145 107 127 108 109
               C109 91 118 76 130 65Z"
            fill="#f0bd45" stroke="#a86619" stroke-width="1.5"/>
      <path d="M70 65
               C79 76 88 82 100 82
               C112 82 121 76 130 65
               C128 91 126 111 127 132
               C128 160 117 181 100 184
               C83 181 72 160 73 132
               C74 111 72 91 70 65Z"
            fill="#f3c34f" stroke="#a86619" stroke-width="1.5"/>
      <path d="M100 83 C94 105 95 140 100 173" fill="none" stroke="#c47c20" stroke-width="2" opacity=".35"/>
      <path d="M82 83 C76 111 79 145 89 166" fill="none" stroke="#c47c20" stroke-width="1.5" opacity=".22"/>
      <path d="M118 83 C124 111 121 145 111 166" fill="none" stroke="#c47c20" stroke-width="1.5" opacity=".22"/>
    </g>

    <!-- Rosa: varios pétalos superpuestos y centro en espiral, en vez de círculos -->
    <g id="flor-rosa">
      <path d="M100 174 C96 213 103 252 100 304" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 223 C78 210 56 223 50 248 C75 255 94 242 100 223Z" fill="#4f824c"/>
      <path d="M100 258 C120 246 142 260 150 283 C125 288 107 276 100 258Z" fill="#477845"/>
      <path d="M54 91
               C50 70 67 51 88 56
               C99 38 126 43 133 63
               C153 67 159 91 145 105
               C150 127 129 143 111 137
               C96 153 70 143 69 124
               C51 117 45 102 54 91Z"
            fill="#efbd43" stroke="#a86619" stroke-width="1.5"/>
      <path d="M66 88
               C75 67 96 63 109 78
               C121 63 145 73 141 93
               C159 100 149 124 130 121
               C128 140 103 143 94 126
               C77 138 59 121 69 107
               C53 101 55 91 66 88Z"
            fill="#f4c956" stroke="#b2711d" stroke-width="1.4"/>
      <path d="M80 91
               C84 76 103 73 111 87
               C122 77 137 91 128 103
               C139 114 122 130 109 119
               C101 135 82 124 88 110
               C72 106 70 96 80 91Z"
            fill="#e9ad32" stroke="#a86619" stroke-width="1.3"/>
      <path d="M92 96 C98 87 111 91 108 101 C119 100 121 113 110 116 C105 127 93 120 96 111 C85 110 84 100 92 96Z"
            fill="#d99225" stroke="#9a5f18" stroke-width="1.2"/>
      <path d="M99 101 C104 96 112 101 108 106 C113 111 106 116 101 112 C96 116 91 110 96 106 C92 102 95 98 99 101Z"
            fill="#9f5d1b"/>
    </g>
  </defs>
</svg>

<main class="tarjeta-page">
  <div class="bloom-stage" id="bloom-stage" hidden></div>

  <div class="card card-pending" id="card">
    <div class="petals-layer" id="petals"></div>
    <div class="card-flower">
      <svg viewBox="0 0 200 320" aria-hidden="true"><use href="#flor-girasol" id="flower-use"></use></svg>
    </div>
    <div class="card-ornament" aria-hidden="true">❦</div>
    <p class="card-to">Para <span id="c-to">ti</span></p>
    <p class="card-msg" id="c-msg">Hoy es un buen día para regalar flores amarillas.</p>
    <p class="card-from" id="c-from"></p>
  </div>
</main>

<script src="tarjeta.js"></script>
</body>
</html>
