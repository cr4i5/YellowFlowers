<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor amarilla para ti</title>
<meta name="description" content="Alguien te envió una flor amarilla.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-blooms" aria-hidden="true"></div>

        <ellipse cx="100" cy="43" rx="15" ry="43" transform="rotate(90 100 100)"/>

      <circle cx="100" cy="100" r="27" fill="#5a3518"/>

      <circle cx="108" cy="106" r="3" fill="#9b6529" opacity=".8"/>

      <circle cx="100" cy="100" r="21" fill="#d89b28"/>

               C101 130 106 111 109 94

      <path d="M62 61 C72 68 84 71 100 72 C116 71 128 68 138 61"
            fill="none" stroke="#c47c20" stroke-width="2" opacity=".45"/>

    </g>

    <!-- Orquídea amarilla: pétalos suaves, centro marcado y tallo unido -->
    <g id="flor-orquidea">
      <path d="M100 155 C96 195 103 243 100 304" fill="none" stroke="#315c35" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 216 C79 204 58 218 51 242 C75 248 94 236 100 216Z" fill="#4f824c"/>
      <path d="M100 254 C120 242 141 255 149 278 C125 283 108 272 100 254Z" fill="#477845"/>
      <path d="M100 153 C90 159 83 160 75 153 L82 137 C90 143 95 145 100 145 C105 145 110 143 118 137 L125 153 C117 160 110 159 100 153Z"
            fill="#3c7040"/>
      <path d="M100 95

               C103 163 122 160 125 137

      <circle cx="100" cy="108" r="7" fill="#9d5a1a"/>
      <circle cx="100" cy="105" r="2.2" fill="#ffd96b"/>

  </defs>
</svg>

<main class="tarjeta-page">
  <div class="flower-meadow" id="flower-meadow" aria-hidden="true"></div>

  <div class="card card-pending" id="card">
    <div class="petals-layer" id="petals"></div>
    <div class="card-flower">
      <svg viewBox="0 0 200 320" aria-hidden="true"><use href="#flor-girasol" id="flower-use"></use></svg>
    </div>
    <div class="card-ornament" aria-hidden="true">❦</div>
    <p class="card-to">Para <span id="c-to">ti</span></p>
    <p class="card-msg" id="c-msg">Hoy es un buen día para regalar flores amarillas.</p>
    <p class="card-from" id="c-from"></p>
  </div>
</main>

<script src="tarjeta.js"></script>
</body>
</html>
